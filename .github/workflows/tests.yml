name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Test
        # Run from inside the package directory so the installed copy is
        # imported. The repository root is a package parent and would shadow it.
        run: python -m unittest discover -b -p "*test.py"
        working-directory: paranoid_crypto
      - name: Test tlscheck
        # tlscheck is a separate package. Run it from the repository root so
        # `python -m tlscheck` and `import tlscheck` resolve the same tree.
        run: python -m unittest tlscheck.tlscheck_test
